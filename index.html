<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2EFE7">
<title>Margvant</title>
<style>
  :root{--paper:#F2EFE7;--ink:#15150F;--muted:rgba(21,21,15,.55);--accent:#FFE600}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;min-height:100dvh;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    position:relative;height:100dvh;width:auto;max-width:100vw;
    aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;
    background:var(--paper);
  }
  video{
    display:block;width:100%;height:100%;object-fit:contain;background:var(--paper);
    outline:none;cursor:pointer;
  }
  .toggle{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:86px;height:86px;border-radius:50%;border:1.5px solid rgba(21,21,15,.82);
    background:rgba(242,239,231,.92);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;appearance:none;
    box-shadow:0 10px 30px rgba(21,21,15,.18);
    transition:opacity .22s ease, transform .22s ease, background .22s ease;
    z-index:3;
  }
  .toggle:hover{background:var(--accent);transform:translate(-50%,-50%) scale(1.04)}
  .toggle:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
  .toggle svg{display:block;width:32px;height:32px;fill:currentColor}
  .toggle .pause{display:none}
  .stage.playing .play{display:none}
  .stage.playing .pause{display:block}
  .stage.playing .toggle{opacity:0;pointer-events:none}
  .stage.playing .toggle:focus-visible{opacity:1;pointer-events:auto}
  .stage.ended .toggle{opacity:1;pointer-events:auto;left:auto;top:auto;right:20px;bottom:20px;transform:none;width:48px;height:48px;background:rgba(242,239,231,.94)}
  .stage.ended .toggle svg{width:22px;height:22px}
  .stage.ended .play{display:none}
  .stage.ended .toggle:hover{background:var(--accent)}
  .stage.ended .replay{display:block}
  .toggle .replay{display:none}
  @media (hover:hover) and (pointer:fine){
    .stage.playing:hover .toggle{opacity:1;pointer-events:auto}
  }
  @media (max-width:640px){
    .stage{height:100dvh;width:100vw;max-width:100vw}
    .toggle{width:72px;height:72px}
    .stage.ended .toggle{width:44px;height:44px;right:16px;bottom:16px}
    .toggle svg{width:27px;height:27px}
  }
  @media (prefers-reduced-motion:reduce){
    .toggle{transition:none}
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <video id="reel" src="./reel.mp4" preload="auto" playsinline aria-label="Margvant commercial"></video>
  <button class="toggle" id="toggle" type="button" aria-label="Play">
    <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.2 1.5.8l10.2-6.8c.6-.4.6-1.2 0-1.6L9.5 4.4C8.9 4 8 4.4 8 5.2z"/></svg>
    <svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="4.5" width="4" height="15" rx="1"/><rect x="13.5" y="4.5" width="4" height="15" rx="1"/></svg>
    <svg class="replay" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
  </button>
</main>
<script>
(function(){
  var stage=document.getElementById('stage');
  var video=document.getElementById('reel');
  var toggle=document.getElementById('toggle');

  function setLabel(label){ toggle.setAttribute('aria-label',label); }
  function showPlaying(on){
    stage.classList.toggle('playing',on);
    stage.classList.toggle('ended',false);
    setLabel(on?'Pause':'Play');
  }
  function play(){
    var p=video.play();
    if(p&&p.catch) p.catch(function(){ showPlaying(false); });
  }
  function pause(){
    video.pause();
  }
  function togglePlay(){
    if(video.ended){ video.currentTime=0; play(); return; }
    if(video.paused) play(); else pause();
  }

  toggle.addEventListener('click',function(e){ e.stopPropagation(); togglePlay(); });
  video.addEventListener('click',togglePlay);

  video.addEventListener('play',function(){
    stage.classList.remove('ended');
    stage.classList.add('playing');
    setLabel('Pause');
  });
  video.addEventListener('pause',function(){
    if(video.ended) return;
    stage.classList.remove('playing');
    setLabel('Play');
  });
  video.addEventListener('ended',function(){
    stage.classList.remove('playing');
    stage.classList.add('ended');
    setLabel('Replay');
  });

  document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.key===' '||e.key==='Enter'){
      if(document.activeElement===toggle) return;
      e.preventDefault(); togglePlay();
    }
  });

  // Keep the picture inside the viewport as mobile browser chrome changes.
  function fit(){
    var h=window.visualViewport?window.visualViewport.height:window.innerHeight;
    stage.style.height=Math.min(h,window.innerHeight)+'px';
  }
  window.addEventListener('resize',fit);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);
  fit();

  // Load the first frame without starting playback where the browser allows it.
  video.addEventListener('loadedmetadata',function(){
    if(video.readyState>=2) return;
    try{ video.currentTime=0.04; }catch(e){}
  },{once:true});
})();
</script>
</body>
</html>
