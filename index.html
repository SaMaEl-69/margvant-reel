<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Margvant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #141713;
    color: #F4F1EA;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  video {
    width: min(92vw, 1120px);
    max-height: 82vh;
    aspect-ratio: 16 / 9;
    background: #101010;
    display: block;
    cursor: pointer;
  }
  button {
    appearance: none;
    border: 1px solid rgba(244, 241, 234, 0.28);
    background: #1d211b;
    color: #F4F1EA;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  button:hover {
    border-color: #FFF200;
    color: #FFF200;
  }
</style>
</head>
<body>
  <main>
    <video id="reel" src="./reel.mp4" playsinline preload="metadata"></video>
    <button id="toggle" type="button" aria-label="Play or pause video">Play</button>
  </main>
  <script>
    const video = document.getElementById('reel');
    const btn = document.getElementById('toggle');
    function syncLabel() {
      btn.textContent = video.paused || video.ended ? 'Play' : 'Pause';
    }
    function togglePlay() {
      if (video.paused || video.ended) {
        video.play();
      } else {
        video.pause();
      }
    }
    btn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);
    video.addEventListener('play', syncLabel);
    video.addEventListener('pause', syncLabel);
    video.addEventListener('ended', syncLabel);
  </script>
</body>
</html>
